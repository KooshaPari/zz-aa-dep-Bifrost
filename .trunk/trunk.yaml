# Trunk config. Replaces an invalid file (unknown top-level keys, no version) that made every
# `trunk check` abort with "invalid config". Linters run on changed files in PRs.
version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.7.4
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - actionlint@1.7.7
    - gitleaks@8.28.0
    - markdownlint@0.45.0
    - yamllint@1.37.1
    - git-diff-check
