name: Dependency and code scans

# Replaces the Snyk workflow (paid Snyk token and step-security/harden-runner
# subscription are not available). Free equivalents, no tokens:
#   - OSV-Scanner for dependency vulnerabilities (covers the Snyk Open Source job)
#   - Trivy filesystem scan for vulnerabilities, secrets and misconfiguration
#     (covers the Snyk Code job's static checks as far as a free scanner can)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  osv-scanner:
    name: Dependency scan (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: OSV-Scanner
        # Report-only: findings show in the job log and do not block merges.
        # Critical vulnerabilities are fixed through follow-up bump PRs.
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            ./

  trivy-fs:
    name: Code and config scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Report-only: findings are uploaded as an artifact and do not block merges.
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: ignore
